name: AnimePahe Facebook detector
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/animepahe-probe.mjs'
      - '.github/workflows/animepahe-probe.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: animori-animepahe-facebook-detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Detect AnimePahe episodes
        env:
          ANIMEPAHE_DETECT_URL: https://agiqhqnqkiagnabbczyf.supabase.co/functions/v1/facebook-animepahe-detect
          MEDIA_BRIDGE_SECRET: ${{ secrets.MEDIA_BRIDGE_SECRET }}
          ANIMEPAHE_FORCE_TITLE: Link Click Season 3
          ANIMEPAHE_FORCE_EPISODE: '7'
        run: node scripts/animepahe-probe.mjs
