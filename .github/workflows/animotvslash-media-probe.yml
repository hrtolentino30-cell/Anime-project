name: Animori Facebook uploads

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: "Optional episode URL; leave blank to process eligible new episodes"
        required: false
        default: ""
  push:
    branches: [main]
  schedule:
    # Peak: every 5 minutes from 21:00 through 01:59 PHT.
    - cron: "*/5 13-17 * * *"
    # 02:00 PHT boundary run.
    - cron: "0 18 * * *"
    # Off-peak: every 10 minutes.
    - cron: "7,17,27,37,47,57 0-12,19-23 * * *"
    - cron: "10,20,30,40,50 18 * * *"

permissions:
  contents: read

# Only one workflow run at a time; its matrix may contain two isolated runners.
concurrency:
  group: animori-facebook-auto-upload
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.slots.outputs.matrix }}
      has_work: ${{ steps.available.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: slots
        name: Select workers for Philippine peak hours
        env:
          ANIMOTV_EPISODE_URL: ${{ inputs.episode_url }}
        run: echo "matrix=$(node scripts/facebook-worker-slots.mjs)" >> "$GITHUB_OUTPUT"
      - id: available
        name: Check queue before heavy worker setup
        env:
          FACEBOOK_UPLOAD_PROXY_URL: https://agiqhqnqkiagnabbczyf.supabase.co/functions/v1/facebook-upload-proxy
        run: node scripts/facebook-work-available.mjs

  probe:
    needs: capacity
    if: needs.capacity.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.capacity.outputs.matrix) }}
    name: Facebook upload worker ${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Claim and upload an eligible episode
        env:
          ANIMOTV_EPISODE_URL: ${{ inputs.episode_url }}
          FACEBOOK_WORKER_SLOT: ${{ matrix.slot }}
          FACEBOOK_UPLOAD_PROXY_URL: https://agiqhqnqkiagnabbczyf.supabase.co/functions/v1/facebook-upload-proxy
        run: node scripts/animotvslash-media-probe.mjs
