name: ANIMOTVSLASH media probe

on:
  push:
    paths:
      - 'scripts/animotvslash-media-probe.mjs'
      - '.github/workflows/animotvslash-media-probe.yml'
  workflow_dispatch:
    inputs:
      episode_url:
        description: "Public ANIMOTVSLASH episode URL"
        required: false
        default: "https://animotvslash.org/the-beginning-after-the-end-season-2-episode-10/"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Resolve player candidates
        env:
          ANIMOTV_EPISODE_URL: ${{ inputs.episode_url }}
          FACEBOOK_INGEST_URL: ${{ secrets.FACEBOOK_INGEST_URL }}
          FACEBOOK_INGEST_SECRET: ${{ secrets.FACEBOOK_INGEST_SECRET }}
          ANIMORI_SYNC_SOURCE_URL: ${{ secrets.ANIMORI_SYNC_SOURCE_URL }}
        run: node scripts/animotvslash-media-probe.mjs
