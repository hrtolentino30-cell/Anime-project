name: ANIMOTVSLASH media probe

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: "Optional episode URL; leave blank to process the next queued new episode"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: animori-facebook-auto-upload
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Resolve player candidates
        env:
          ANIMOTV_EPISODE_URL: ${{ inputs.episode_url }}
          FACEBOOK_RESOLVED_MEDIA_URL: ${{ secrets.FACEBOOK_RESOLVED_MEDIA_URL }}
          MEDIA_BRIDGE_SECRET: ${{ secrets.MEDIA_BRIDGE_SECRET }}
          FACEBOOK_UPLOAD_PROXY_URL: https://agiqhqnqkiagnabbczyf.supabase.co/functions/v1/facebook-upload-proxy
        run: node scripts/animotvslash-media-probe.mjs
