name: ANIMOTVSLASH media probe

on:
  push:
    paths:
      - 'scripts/animotvslash-media-probe.mjs'
      - '.github/workflows/animotvslash-media-probe.yml'
  workflow_dispatch:
    inputs:
      episode_url:
        description: "Public ANIMOTVSLASH episode URL"
        required: false
        default: "https://animotvslash.org/the-exiled-heavy-knight-knows-how-to-game-the-system-episode-12/"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Resolve player candidates
        env:
          ANIMOTV_EPISODE_URL: ${{ inputs.episode_url || 'https://animotvslash.org/the-exiled-heavy-knight-knows-how-to-game-the-system-episode-12/' }}
          FACEBOOK_RESOLVED_MEDIA_URL: ${{ secrets.FACEBOOK_RESOLVED_MEDIA_URL }}
          MEDIA_BRIDGE_SECRET: ${{ secrets.MEDIA_BRIDGE_SECRET }}
        run: node scripts/animotvslash-media-probe.mjs
