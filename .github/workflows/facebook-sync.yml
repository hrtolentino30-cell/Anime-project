name: Facebook source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: facebook-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: facebook-sync
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check authorized Facebook sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FACEBOOK_INGEST_SECRET: ${{ secrets.FACEBOOK_INGEST_SECRET }}
          FACEBOOK_AUTH_STATE_B64: ${{ secrets.FACEBOOK_AUTH_STATE_B64 }}
          FACEBOOK_SOURCE_URLS: |
            https://www.facebook.com/profile.php?id=61569593189979
            https://www.facebook.com/profile.php?id=100095424495663
        run: npm run facebook:sync
